# Render Blueprint: free web service + free PostgreSQL (temporary plan).
# Free PostgreSQL instances expire after 30 days; export data before expiration.
# Universal Bot remains Termux-only; this service deploys the portal, not the bot.
services:
  - type: web
    name: multibot-panel
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: multibot-db
          property: connectionString

databases:
  - name: multibot-db
    plan: free
    region: oregon
    databaseName: multibot
    user: multibot
    ipAllowList: []
